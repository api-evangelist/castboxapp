aid: castboxapp
name: Castbox
description: Castbox is a free cross-platform podcast and audio content platform that lets
  listeners discover, stream, download, and manage millions of podcasts, audiobooks, and
  radio shows across Apple iOS, Android, Amazon Alexa, Google Home, CarPlay, Android Auto,
  and the web. Alongside its consumer listening apps, Castbox offers a "For Podcasters" suite
  for creators to host, distribute, and monetize their shows. Surfaced as a portfolio company
  of Qiming Venture Partners and added to the API Evangelist network, Castbox is a consumer
  audio company that publishes no public developer API portal; this profile captures its
  public identity, legal, and support surface.
